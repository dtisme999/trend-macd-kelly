# 趋势-MACD 预判买点 + A 锚点状态机 · 个人研究版默认配置(中性档)
# 见 config_loader.py 每个字段的注释。切换保守/激进档见 profiles.yaml。

seed: 42

project:
  name: trend_macd_state_machine
  market: cn_stock_daily
  benchmark: "000300"
  start_date: "2016-01-01"
  end_date: "2026-07-17"

data:
  provider: "akshare"
  adjust: "hfq"
  use_st_filter: false
  min_listing_days: 120
  min_avg_amount_20d: 50000000
  symbols_source: "hs300"
  custom_symbols: []
  universe_size: 50

features:
  ma_fast: 20
  ma_mid: 60
  ma_slow: 120
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  vol_period: 20
  trend_score_min: 4
  regime_fast: 20
  regime_slow: 60
  regime_slope: 20

signal:
  prior_pos_bars: 7          # 紧邻的前一连续正柱段不少于 7 根
  min_neg_bars: 2            # 当前连续负柱段不少于 2 根
  max_neg_bars: 7            # 当前连续负柱段不多于 7 根
  convergence_count: 1       # 当前必须是连续收敛序列的第 1 根
  min_strength_ratio: 2.0    # 前正柱最大值 / 当前负柱段最小值绝对值
  cooldown_days: 5

execution:
  init_cash: 1000000
  price_rule: "next_open"
  lot_size: 1                 # 策略模拟按整数股，不引入整手/零股细节
  slippage_bp: 5
  buy_commission_bp: 2.5
  sell_commission_bp: 2.5
  min_commission: 5
  stamp_tax_sell_bp: 10

position:
  fixed_weight: 0.05          # 首仓 5%,每档加仓 5%
  max_single_weight: 0.10     # 首仓 + 一档 = 10%
  max_total_exposure: 0.80

risk:
  stop_s1_pct: 0.06           # S1: close < 0.94A 全清
  stop_s2_pct: 0.03           # S2: close < 1.03A 全清
  add_trigger_pct: 0.10       # close ≥ 1.10A 加仓
  tp1_pct: 0.20               # 1.20A
  tp2_pct: 0.30               # 1.30A
  tp3_pct: 0.40               # 1.40A
  lock_inband_pct: 0.01       # S2 保本回落线
  trail_s3_pct: 0.08          # S3 回落 1.08A 全清
  trail_s4_pct: 0.15          # S4 回落 1.15A 全清
  reduce_fraction_tier: 0.3333
  timeout_days: 5
  max_holding_days: 120

validation:
  walk_forward: true
  train_years: 3
  test_years: 1
  step_years: 1
  bootstrap_reps: 1000
  bootstrap_block_len: 20
  bootstrap_type: "stationary"
  run_spa_test: true
  run_dsr: true
  n_trials_for_dsr: 9
